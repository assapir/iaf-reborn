keys: Key card
keys_intro: "Every key of the sim's key table: first on a drawn keyboard, one for the keys alone and one for each modifier key held, then in tables by the groups of the Keys screen. A key can be changed on that screen; this card shows the defaults."
key_layers: {"": Keys alone, Shift: Keys with Shift held, Ctrl: Keys with Ctrl held, Alt: Keys with Alt held}
keyboard_number: "A function too long for its cap: see the list under the keyboard."
keyboard_note: "The sim reads a key by its place on the keyboard, so the drawing holds for every language's keyboard. The caps show the US legends on the ISO layout."
key_layers_mac:
  "": "macOS: the same keys. The sim starts from the laptop map there, which moves the numpad's commands and a few others: the tables after the keyboards give each command's macOS key."
  Shift: "macOS: hold Shift."
  Ctrl: "macOS: hold Cmd (the dark Win / Cmd key); Ctrl works as well. With Q and with M hold Ctrl: macOS keeps Cmd with those two keys for itself (quit, minimise). With the arrows hold Cmd: macOS keeps Ctrl with the arrows for its desktops."
  Alt: "macOS: hold Option."
