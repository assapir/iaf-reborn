# The F-16I Sufa flight manual's outline: the chapters and sections in the real manual's order. sim: full | part |
# none (what the sim models); covers / not: the plan of a section still to write; file: a written section's text.
title: "F-16I Sufa"
subtitle: Flight manual
tagline: "The Israeli Air Force's two-seat strike fighter, as flown in Modern IAF."
scope: "It is the complete flight manual of the F-16I Sufa as Modern IAF models it: the jet's systems, its normal and emergency procedures, its limits, how it flies, and its avionics and weapons."
jet: {name: "F-16I Sufa", short: "Sufa"}
chapters:
- id: description
  title: Description and systems
  intro: What the jet is and how each system works, with every control and indicator of the cockpit.
  sections:
  - {id: aircraft, title: The aircraft, sim: part, file: f16/ch1/aircraft.typ}
  - {id: cockpit, title: Cockpit arrangement, sim: part, file: f16/cockpit.typ}
  - {id: engine, title: Engine, sim: part, file: f16/ch1/engine.typ}
  - {id: fuel, title: Fuel system, sim: part, file: f16/ch1/fuel.typ}
  - {id: electrical, title: Electrical system, sim: part, file: f16/ch1/electrical.typ}
  - {id: hydraulic, title: Hydraulic system, sim: none, file: f16/ch1/hydraulic.typ}
  - {id: gear, title: "Landing gear, brakes and steering", sim: part, file: f16/ch1/gear.typ}
  - {id: flight-controls, title: Flight control system, sim: part, file: f16/ch1/flight-controls.typ}
  - {id: instruments, title: Flight instruments, sim: full, file: f16/ch1/instruments.typ}
  - {id: canopy-seat, title: "Canopy, ejection seat and life support", sim: part, file: f16/ch1/canopy-seat.typ}
  - {id: lighting, title: Lighting, sim: full, file: f16/ch1/lighting.typ}
  - {id: warnings, title: "Warning, caution and voice messages", sim: part, file: f16/ch1/warnings.typ}
- id: normal
  title: Normal procedures
  intro: Each phase of a flight as a procedure, in the order of the jet's checklist card.
  sections:
  - {id: preflight, title: Preflight and cockpit entry, sim: none, file: f16/ch2/preflight.typ}
  - {id: cold-start, title: Cold start to take-off, sim: part, file: f16/cold-start.typ}
  - {id: climb-cruise, title: "Climb, cruise and descent", sim: full, file: f16/ch2/climb-cruise.typ}
  - {id: landing, title: Approach and landing, sim: part, file: f16/ch2/landing.typ}
  - {id: shutdown, title: After landing and engine shutdown, sim: full, file: f16/ch2/shutdown.typ}
  - {id: air-refuelling, title: Air refuelling, sim: none, file: f16/ch2/air-refuelling.typ}
- id: emergency
  title: Emergency procedures
  intro: The real jet's emergencies by phase of flight. Each item says whether the sim can produce it.
  sections:
  - {id: emergency-general, title: How an emergency shows, sim: part, file: f16/ch3/general.typ}
  - {id: emergency-ground, title: Ground emergencies, sim: part, file: f16/ch3/ground.typ}
  - {id: emergency-takeoff, title: Take-off emergencies, sim: part, file: f16/ch3/takeoff.typ}
  - {id: emergency-engine, title: Engine emergencies in flight, sim: part, file: f16/ch3/engine.typ}
  - {id: emergency-systems, title: "Electrical, hydraulic and flight control failures", sim: none, file: f16/ch3/systems.typ}
  - {id: emergency-control, title: Out-of-control recovery, sim: part, file: f16/ch3/control.typ}
  - {id: emergency-landing, title: Landing emergencies, sim: part, file: f16/ch3/landing.typ}
  - {id: ejection, title: Ejection, sim: full, file: f16/ch3/ejection.typ}
- id: limits
  title: Limits
  intro: The real jet's operating limits. A limit the sim does not enforce is marked.
  sections:
  - {id: limits-engine, title: Engine limits, sim: part, covers: "The start limits (20 % RPM before the throttle moves), idle, military and afterburner RPM.", not: "Temperature and oil-pressure limits: the gauges show values, and exceeding one has no consequence."}
  - {id: limits-airspeed, title: "Airspeed, Mach and altitude limits", sim: part, covers: "The gear's 300 kt limit, the flight model's maximum speed and ceiling.", not: "Canopy, tank and store carriage speed limits."}
  - {id: limits-g, title: "Load factor and angle-of-attack limits", sim: full, covers: "The CAT I and CAT III limiters' g and angle-of-attack limits by configuration, and what the pilot feels at the limit."}
  - {id: limits-weight, title: "Weight, stores and landing limits", sim: part, covers: "Maximum take-off weight, what each station may carry, the touchdown sink rate that damages the gear.", not: "Centre-of-gravity limits and asymmetric-load limits."}
- id: handling
  title: Flight characteristics
  intro: How the jet behaves through its envelope.
  sections:
  - {id: handling-general, title: Handling with the fly-by-wire system, sim: full, covers: "What the stick commands (g, roll rate), the neutral speed stability, the gains' change with the gear down."}
  - {id: handling-takeoff-landing, title: Take-off and landing characteristics, sim: full, covers: "Rotation speeds by weight, the take-off roll, ground effect, the approach on angle of attack, crosswind."}
  - {id: handling-high-aoa, title: High angle of attack and departures, sim: part, covers: "Behaviour at the limiter, with CAT III loads, and beyond it.", not: "Departure modes outside the published aerodynamic data the flight model uses."}
  - {id: handling-stores, title: Flight with stores, sim: full, covers: "The drag and weight of tanks, pods and weapons, asymmetric loads and the roll trim, CAT III."}
  - {id: handling-performance, title: Performance, sim: full, covers: "Climb, level acceleration, sustained and instantaneous turn, range and endurance, as the sim's flight model flies them."}
- id: avionics
  title: Weapons and avionics
  intro: Every display and mode, then each weapon's employment procedure. This chapter describes cockpit procedure only.
  sections:
  - {id: hotas, title: The stick and throttle switches, sim: part, covers: "TMS, DMS, CMS, the cursor, the dogfight and missile-override switch, the trigger and the weapon release button, each with its key.", not: "The missile's cage and uncage button."}
  - {id: ufc, title: "The up-front controls and the DED", sim: full, covers: "The ICP's keys and every DED page with its data entry: steerpoints, markpoints, radios, TACAN and ILS, bingo, ALOW, time, bullseye, INS, EWS, IFF, data link."}
  - {id: hud, title: The HUD and the helmet display, sim: full, covers: "The HUD in NAV, air-to-air and air-to-ground, the HUD control panel's switches, the ground-avoidance cues, the helmet display."}
  - {id: mfd, title: The multifunction displays, sim: part, covers: "The MFD frame, the format menu, the sensor of interest, and the FCR, HSD, SMS, WPN, TGP, TEST, DTE and FLCS formats.", not: "The FLIR and TFR formats."}
  - {id: navigation, title: Navigation, sim: full, covers: "The INS alignment, steerpoints and the route, TACAN, the ILS, the EHSI's modes, the autopilot's steering."}
  - {id: radios, title: "Radios, IFF and data link", sim: part, covers: "COM1 and COM2 presets, the calls to air traffic control and the AWACS, the AIFF interrogator, the data link's tracks on the HSD and the FCR.", not: "Tuning that changes who answers. The IFF transponder's modes."}
  - {id: radar-aa, title: "Radar: air-to-air", sim: full, covers: "The FCR format with the AN/APG-68(V)9's modes: CRM (RWS, TWS, VSR), the situation-awareness mode with four tracked targets, single-target track and the four ACM patterns; the cursor, scan width, bars and elevation."}
  - {id: radar-ag, title: "Radar: air-to-ground", sim: part, covers: "Ground map with EXP and DBS, freeze, snowplow, the ground cursor, fixed-target track, GMT, SEA and air-to-ground ranging.", not: "The beacon and terrain-following modes."}
  - {id: tgp, title: The targeting pod, sim: full, covers: "The pod's power on RIGHT HDPT, the TGP format, its tracks and zoom, slaving it, LASER ARM and firing the laser."}
  - {id: ew, title: "Threat warning and countermeasures", sim: part, covers: "The threat warning display and its buttons, the missile approach warning, the CMDS panel and its programs, the CMS keys, the jammer's key.", not: "The jammer's own controls and modes. The manual gives the switches and counts only, never how well a countermeasure works."}
  - {id: stores, title: "Stores management, master arm and jettison", sim: full, covers: "MASTER ARM and SIMULATE, the SMS pages, selecting a weapon, the release rules, selective and emergency jettison."}
  - {id: aa-weapons, title: "Air-to-air employment: missiles and gun", sim: part, covers: "The procedure for a short-range missile shot, a helmet-cued shot, a radar missile shot and a gun attack: the switches, the HUD cues, the release.", not: "The missile's cage and uncage, and the cues after launch. The manual gives no missile performance."}
  - {id: ag-weapons, title: "Air-to-ground employment: bombs and gun", sim: part, covers: "CCIP and delayed CCIP, ripple settings, laser-guided bombs with the pod, GPS-guided bombs in PRE and VIS, strafing.", not: "CCRP, DTOS, LADD and manual release; fuze and arming settings."}
