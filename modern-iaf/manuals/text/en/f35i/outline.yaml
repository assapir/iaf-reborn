  - {id: warnings, title: "Warnings, cautions and advisories", sim: part, file: f35i/ch1/warnings.typ}
- id: normal
  title: Normal procedures
  intro: Each phase of a flight as a procedure, in the order of the jet's checklist card.
  sections:
