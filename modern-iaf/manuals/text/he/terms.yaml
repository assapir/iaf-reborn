# The Hebrew edition's term table: one thing, one term. en: the English manual's term; he: the term the Hebrew text
# uses; from: where the term comes from (game: the game's own Hebrew strings, which the screens show; field: the term
# Hebrew speakers in the field use; english: said in English, kept in Latin letters; plain: an ordinary Hebrew word);
# not: other words for the same thing, which stop the build when a Hebrew text holds one (tools/manuals.py).
# Initials and anything printed on a panel or a display stay in English as shown and need no row.
