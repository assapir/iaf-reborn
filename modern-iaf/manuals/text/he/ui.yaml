checklist: בד"ח
checklist_intro: כרטיס הבד"ח המלא של המטוס, כפי שהפנקס מציג אותו בטיסה. עיגול ריק מסמן פריט שהסימולטור אינו בודק; יש לקרוא אותו ולהמשיך.
keys: כרטיס מקשים
keys_intro: "כל המקשים שבטבלת המקשים של הסימולטור: תחילה על מקלדת מצוירת, אחת למקשים לבדם ואחת לכל מקש צירוף לחוץ, ואחר כך בטבלאות לפי הקבוצות שבמסך המקשים. אפשר לשנות מקש במסך הזה; הכרטיס מציג את ברירות המחדל."
key_layers: {"": המקשים לבדם, Shift: מקשים עם Shift לחוץ, Ctrl: מקשים עם Ctrl לחוץ, Alt: מקשים עם Alt לחוץ}
keyboard_number: "פקודה ששמה ארוך מהמקש: הרשימה שמתחת למקלדת מפרטת אותה."
keyboard_note: "הסימולטור קורא מקש לפי מקומו במקלדת, ולכן הציור נכון למקלדת בכל שפה. על המקשים מופיעים הסימונים האמריקאיים בפריסת ISO."
key_layers_mac:
  "": "macOS: אותם מקשים. שם הסימולטור מתחיל ממפת המקשים למחשב נייד, שמעבירה את הפקודות של מקלדת המספרים ועוד כמה פקודות: הטבלאות שאחרי המקלדות נותנות את מקש ה-macOS של כל פקודה."
  Shift: "macOS: להחזיק את Shift."
  Ctrl: "macOS: להחזיק את Cmd (המקש הכהה Win / Cmd); גם Ctrl פועל. עם Q ועם M להחזיק את Ctrl: את Cmd עם שני המקשים האלה macOS שומר לעצמו (יציאה, מזעור). עם החיצים להחזיק את Cmd: את Ctrl עם החיצים macOS שומר לשולחנות העבודה שלו."
  Alt: "macOS: להחזיק את Option."
