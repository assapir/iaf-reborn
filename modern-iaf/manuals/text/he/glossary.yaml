# מילון המונחים של מדריך המשחק בעברית: term, means. הקיצורים נשארים באנגלית, כפי שהם כתובים בתא הטייס.
- {term: AWACS, means: "Airborne warning and control system: מטוס עם מכ״ם גדול, שהבקר שבו מוסר בקשר היכן נמצאים מטוסים אחרים.", in: [game]}
- {term: INS, means: "Inertial navigation system: מערכת הניווט האינרציאלית. יש ליישר אותה על הקרקע לפני שהיא מנווטת."}
- {term: RPM, means: "מהירות המנוע, באחוזים."}
- {term: אישור, means: "הרשות שהמגדל נותן לשלב אחד של הטיסה: התנעה, הסעה, כניסה למסלול, המראה.", in: [game]}
- {term: אשף ההתקנה, means: "התוכנה שמורידה את הנתונים הפתוחים ובונה את נתוני המשחק, עמוד אחרי עמוד.", in: [game]}
- {term: דלק בינגו, means: "כמות דלק שנקבעת לפני הטיסה: הדלק הנדרש כדי לחזור ולנחות עם רזרבה. מתחתיה המטוס מתריע."}
- {term: דף התקלה, means: "הדף שהמשחק מציג כשאינו יכול להמשיך: מה נכשל, מקום קובץ היומן ולחצן לדיווח.", in: [game]}
- {term: דת״ק, means: "התפריט הראשי של המשחק: המטוסים, הכרטיס של המטוס שנבחר והדרך לכל מסך אחר.", in: [game]}
- {term: Hot start, means: "התנעה שבה דלק מגיע למנוע שמסתובב לאט מדי: עובר בו מעט מדי אוויר, וטמפרטורת הטורבינה עוברת את המגבלה.", in: [game]}
- {term: זמן מוקצב, means: "הזמן מתחילת הטיסה שבתוכו יש להשיג את יעדי המשימה.", in: [game]}
- {term: זמן תמונה, means: "הזמן שנדרש למחשב כדי לצייר תמונה אחת של הטיסה, באלפיות שנייה (מ״ש). זמן תמונה קצר יותר פירושו טיסה חלקה יותר.", in: [game]}
- {term: יומן טיסות, means: "רשימת כל הטיסות שבוצעו בפרופיל, כל אחת עם התחקיר שלה.", in: [game]}
- {term: לא ממודל, means: "תפקוד של המטוס האמיתי שאין בסימולטור. ייתכן שהמתג שלו עדיין זז."}
- {term: מגדל, means: "מגדל הפיקוח של הבסיס. במשימות אימון כל שלב על הקרקע ממתין לאישור המגדל.", in: [game]}
- {term: מיפוי התקן, means: "הצירים והלחצנים שהמשחק מכין מראש לג׳ויסטיק שהוא מכיר בשמו.", in: [game]}
- {term: מפת המקשים למחשב נייד, means: "טבלת המקשים למקלדת בלי מקלדת מספרים. ב-macOS המשחק מתחיל ממנה.", in: [game]}
- {term: נקודת המבער, means: "הנקודה במהלך ידית המצערת שבה מתחיל המבער. ההגדרות שומרות היכן היא נמצאת בידית שבשימוש.", in: [game]}
- {term: נקודת המתנה, means: "המקום במסלול ההסעה, לפני המסלול, שבו המטוס עוצר וממתין לאישור המגדל להתיישר על המסלול.", in: [game]}
- {term: ערכה, means: "קבוצת הגדרות גרפיקה בעלת שם, שמסך ההגדרות קובע בלחיצה אחת.", in: [game]}
- {term: פנקס, means: "לוח הברך של הטייס בסימולטור. הלשונית בד״ח מציגה בו את כרטיס הבד״ח של המטוס ומסמנת את הפריטים שבוצעו."}
- {term: שטח מת, means: "החלק במהלך ציר הג׳ויסטיק, סביב המרכז, שהמשחק קורא כמרכז.", in: [game]}
- {term: שיעור, means: "משימת אימון. לכל מטוס שלושה: התנעה, המראה ומטווח חימוש.", in: [game]}
- {term: שלב התקנה, means: "חלק אחד מעבודת אשף ההתקנה, עם שורה, מד התקדמות ומצב משלו בעמוד ההתקנה.", in: [game]}
- {term: תווית העלות, means: "התווית הקטנה בשורה של הגדרת גרפיקה, שאומרת כמה זמן תמונה הבחירה מוסיפה.", in: [game]}
- {term: תחנה, means: "מקום מתחת לכנף או לגוף המטוס, או בתא חימוש, שבו תלוי חימוש אחד או מתלה אחד.", in: [game]}
- {term: תחקיר, means: "המסך שאחרי הטיסה: התוצאה, כל יעד מול מה שבוצע, והטיסה על מפה ובגרפים.", in: [game]}
- {term: תצורת חימוש, means: "החימוש שהמטוס נושא במשימה, תחנה אחר תחנה.", in: [game]}
