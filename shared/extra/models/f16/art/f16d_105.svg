<desc>105 Squadron ("The Scorpion") on the fins of its F-16Ds, as F-16D 682 wears it on its left side (photo: Wikimedia
 Commons, ברק2020.jpg; 667 on its right: F16D IAF 105 efi elian.jpg): our own drawing, its outline traced on the photo
 laid onto our fin and smoothed (docs/aircraft-models.md §1.6). Seen from the left, the nose to the left; 1 unit = 1
 mm; the box's top left is y -5.1, z 3.17 on the model (y forward, z up), its foot 1.07 m up. The right side
 shows it mirrored (shared/aircraft/tail_number.gd).</desc>
