<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1750">
<desc>109 Squadron ("The Valley") on the fins of its F-16Ds, as F-16D 034 wears it on its left side (photo: Wikimedia
 Commons, F-16D--Our-IDF-2018-IZE-239.jpg; 027 on its right: RamatDavid 020517 Barak 02.jpg): our own drawing, its
 outline traced on the photo laid onto our fin (docs/aircraft-models.md §1.6). Seen from the left, the nose to the
 left; 1 unit = 1 mm; the box's top left is y -5.3, z 2.95 on the model (y forward, z up), its foot 1.2 m up. The
 right side shows it mirrored (shared/aircraft/tail_number.gd).</desc>
