[package]
name = "iaf-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The setup pipeline: from the user's own CDs to everything the game reads (the wizard and tools/setup-cli.sh)"

[dependencies]
iaf-formats = { path = "../iaf-formats" }
iaf-tools = { path = "../iaf-tools" }
anyhow = "1"
crc32fast = "1.5.2"
serde_json = "1.0.154"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

# The update's programs start holding none of the game's open files (update::spawn_alone).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
