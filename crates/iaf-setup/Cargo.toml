[package]
name = "iaf-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The setup pipeline: from the user's own CDs to everything the game reads (tools/setup-cli.sh in-process)"

[dependencies]
iaf-formats = { path = "../iaf-formats" }
iaf-tools = { path = "../iaf-tools" }
anyhow = "1"
crc32fast = "1.5.2"
serde_json = "1.0.154"
zip = { version = "9", default-features = false, features = ["deflate"] }
