<path d="M388,52 C322,58 272,120 276,210 C280,282 332,322 336,362 C340,404 332,440 326,470" stroke-width="24"/>
<path d="M336,44 C250,92 190,202 172,332 C158,442 186,522 246,582" stroke-width="16" stroke-dasharray="42 16"/>
<path d="M300,96 C238,150 212,240 206,330 C202,410 214,470 246,520" stroke-width="10" stroke-dasharray="30 20" stroke-dashoffset="12"/>
<!-- the near wing -->
<path d="M588,322 C540,326 496,352 474,392 C458,420 446,448 440,470" stroke-width="18"/>
<path d="M548,346 C516,372 496,412 490,462 C488,478 488,488 488,496" stroke-width="12"/>
