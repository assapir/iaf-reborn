<!-- talons -->
<path d="M300,672 C312,650 336,648 350,660 M346,690 C362,668 388,668 398,686 M382,716 C398,700 420,702 428,722 M424,742 C440,726 462,730 468,748 M462,716 C478,704 494,710 498,726" stroke-width="12"/>
<path d="M392,770 C404,756 420,758 426,772 M436,780 C446,766 462,768 466,782" stroke-width="10"/>
</g>
