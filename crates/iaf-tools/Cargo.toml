[package]
name = "iaf-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Extraction and conversion tools for Jane's IAF data"

[dependencies]
iaf-formats = { path = "../iaf-formats" }
iaf-avionics = { path = "../iaf-avionics" }
iaf-flight = { path = "../iaf-flight" }
anyhow = "1"
flate2 = "1.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["bmp", "tga", "png", "jpeg"] }
sha2 = "0.10"
texpresso = { version = "2.0.2", features = ["rayon"] }
rayon = "1.11"
krilla = { version = "0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
