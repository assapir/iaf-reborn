[package]
name = "iaf-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Extraction and conversion tools for Jane's IAF data"

[dependencies]
iaf-formats = { path = "../iaf-formats" }
iaf-avionics = { path = "../iaf-avionics" }
iaf-flight = { path = "../iaf-flight" }
anyhow = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["bmp", "tga", "png", "jpeg"] }
