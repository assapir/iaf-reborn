[package]
name = "iaf-godot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Godot 4 GDExtension for iaf-reborn (flight model, terrain, formats)"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
iaf-formats = { path = "../iaf-formats" }
iaf-flight = { path = "../iaf-flight" }
iaf-avionics = { path = "../iaf-avionics" }
iaf-setup = { path = "../iaf-setup" }
iaf-tools = { path = "../iaf-tools" }
serde_json = "1.0.154"
anyhow = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
