[package]
name = "iaf-godot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Godot 4 GDExtension for linux-iaf (flight model, terrain, formats)"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
iaf-formats = { path = "../iaf-formats" }
