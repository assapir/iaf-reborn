# The nightly (docs/release.md): once a day, when main changed since the last nightly, both games' bundles for each
# OS (tools/release/bundle.sh), each started headless (tools/release/smoke.sh), published as ONE rolling pre-release:
# tag `nightly`, replaced each time, its notes the commits since the last one. By hand (Run workflow): the bundles as
# the run's artifacts only, from any branch; "publish" also replaces the pre-release (main only).
name: Nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the nightly pre-release (main only)
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2-stable

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      last: ${{ steps.c.outputs.last }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          echo "last=$last" >>"$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == schedule && "$last" == "$GITHUB_SHA" ]]; then
            echo "main has not changed since the last nightly ($last)"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  bundle:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p iaf-godot
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot-templates.tpz
          key: godot-templates-${{ env.GODOT_VERSION }}
      - run: tools/ci_install_godot.sh templates
        env:
          GODOT_TEMPLATES_TPZ: ${{ runner.temp }}/godot-templates.tpz
      - run: godot --headless --path modern-iaf --import
      - run: godot --headless --path iaf-reborn --import
      - name: Bundles
        run: |
          for p in modern-iaf iaf-reborn; do tools/release/bundle.sh "$p" "$RUNNER_TEMP/bundles"; done
          ls -l "$RUNNER_TEMP/bundles"
      - name: Start each bundle headless
        run: for b in "$RUNNER_TEMP"/bundles/*; do tools/release/smoke.sh "$b"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ runner.os }}
          path: ${{ runner.temp }}/bundles
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [changed, bundle]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ needs.changed.outputs.last }}
        run: |
          notes=$(mktemp)
          {
            echo "Nightly build of main at ${GITHUB_SHA::7} (docs/release.md). Unsigned:"
            echo "- macOS: right-click the app, Open; or \`xattr -dr com.apple.quarantine \"/Applications/<the game>.app\"\`."
            echo "- Windows: SmartScreen's \"Windows protected your PC\": More info, Run anyway."
            echo
            echo "Changes since the last nightly:"
            if [[ -n $LAST ]] && git cat-file -e "$LAST^{commit}" 2>/dev/null; then
              git log --format='- %s (%h)' "$LAST..$GITHUB_SHA"
            else
              git log -20 --format='- %s (%h)'
            fi
          } >"$notes"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly bundles/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" --notes-file "$notes"
