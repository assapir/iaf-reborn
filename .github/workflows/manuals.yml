# Modern IAF's manuals (modern-iaf/docs/manuals.md §3.1): builds the PDFs (the four manuals and the game manual's Hebrew edition) from the repo's text, data and committed
# pictures when one of those inputs changes. On main it commits the rebuilt PDFs back when they differ.
name: Manuals

on:
  push:
    paths: &inputs
      - "modern-iaf/manuals/**"
      - "!modern-iaf/manuals/pdf/**" # the output: the bot's own commit starts no run
      - "modern-iaf/data/checklists/**"
      - "modern-iaf/data/keys.json"
      - "modern-iaf/data/fonts/**"
      - "shared/extra/models/cockpit3d/*.json"
      - "shared/credits.json"
      - "modern-iaf/setup/strings_*.json"
      - "modern-iaf/menu/strings_*.json" # the game manual names the screens by them
      - "tools/manuals.py"
      - "shared/terrain/terrain_view.gd" # the keys it reads by itself are on the key card
      - ".github/workflows/manuals.yml"
  pull_request:
    paths: *inputs
  workflow_dispatch:

concurrency:
  group: manuals-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The official release asset (https://github.com/typst/typst/releases) and its SHA-256; the local build uses the same.
  TYPST_VERSION: 0.15.1
  TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the edition is the date of the last commit to the manuals' sources
      - name: Install Typst
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_SHA256  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: typst --version
      - name: Install ImageMagick (the build's black-picture check)
        run: command -v magick || command -v convert || sudo apt-get install -y --no-install-recommends imagemagick
      - run: python3 -I tools/manuals.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuals
          path: modern-iaf/manuals/pdf/*.pdf
          retention-days: 7
          if-no-files-found: error

  # On main only: the built PDFs become a new commit when they differ from the committed ones.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manuals
          path: modern-iaf/manuals/pdf
      - name: Commit the PDFs that changed
        run: |
          git add modern-iaf/manuals/pdf
          if git diff --cached --quiet; then echo "The committed PDFs are current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Manuals: the PDFs rebuilt by CI from ${GITHUB_SHA::8} [skip ci]"
          # main moved meanwhile: rebase and try once more, then fail. That push's own run rebuilds from its inputs.
          git push origin HEAD:main || { git pull --rebase -X theirs origin main && git push origin HEAD:main; }
