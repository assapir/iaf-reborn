# CI (docs/ci.md). Runs only what works without game data: nothing here reads or downloads the ISO or assets/.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2-stable

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: gdformat / gdlint
        run: |
          python3 -m venv "$RUNNER_TEMP/gdt"
          "$RUNNER_TEMP/gdt/bin/pip" install -q 'gdtoolkit==4.*'
          git ls-files -z '*.gd' | xargs -0 "$RUNNER_TEMP/gdt/bin/gdformat" --line-length 120 --check
          git ls-files -z '*.gd' | xargs -0 "$RUNNER_TEMP/gdt/bin/gdlint"
      - run: python3 -I tools/doclint.py
      - run: python3 -I tests/test_flight_timeline.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace

  godot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p iaf-godot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iaf-godot-${{ runner.os }}
          path: |
            target/release/libiaf_godot.so
            target/release/libiaf_godot.dylib
            target/release/iaf_godot.dll
          retention-days: 7
          if-no-files-found: error
      - run: tools/ci_install_godot.sh
      - run: godot --version
      - run: godot --headless --path game --import
      - name: Parse-check every script
        run: godot --headless --path game -s ../tools/gdparse.gd --log-file "$RUNNER_TEMP/gdparse.log"

  # Informational: which Godot tests run without game data. Its failures never fail the workflow.
  godot-tests:
    needs: godot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iaf-godot-${{ runner.os }}
          path: target/release
      - run: tools/ci_install_godot.sh
      - run: godot --headless --path game --import
      - run: tools/ci_godot_tests.sh
